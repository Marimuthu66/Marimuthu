<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>AI Chatbot</title><style>body{font-family:Arial;background:#050505;color:#eee;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,92%);padding:28px;background:#111;border:1px solid #333;border-radius:22px}input,button,textarea{padding:12px;border-radius:10px;border:1px solid #444;background:#181818;color:#fff}input{width:70%}button{background:#7c3aed;cursor:pointer}.out{margin-top:20px;padding:15px;background:#191919;border-radius:12px}</style><div class=box><h1>🤖 AI Chatbot</h1><input id=i placeholder="Ask hello, Python, AI..."><button onclick=go()>Send</button><div id=o class=out>Ready.</div></div><script>function go(){let q=i.value.toLowerCase();o.textContent=q.includes('hello')?'Hello! I am your AI chatbot.':q.includes('hi')?'Hi! How can I help you?':q.includes('python')?'Python is a popular programming language used for AI and web development.':q.includes('ai')?'AI means Artificial Intelligence: machines performing tasks that normally require human intelligence.':"I don't know that yet, but I can help with basic AI and programming questions."}</script>
