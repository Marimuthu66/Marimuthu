<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>AI Resume Analyzer</title><style>body{font-family:Arial;background:#07111d;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(700px,92%);padding:28px;background:#0d1b2a;border-radius:22px}textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#081018;color:#fff}button{background:#2563eb}</style><div class=box><h1>📄 AI Resume Analyzer</h1><textarea id=t rows=10 placeholder="Paste resume text..."></textarea><button onclick=a()>Analyze Resume</button><pre id=o></pre></div><script>function a(){let s=t.value.toLowerCase();let skills=['python','java','javascript','html','css','sql','machine learning','ai'];let found=skills.filter(x=>s.includes(x));o.textContent=JSON.stringify({skills_detected:found,score:Math.min(100,40+found.length*8),suggestion:'Add measurable achievements, projects and role-specific keywords.'},null,2)}</script>
