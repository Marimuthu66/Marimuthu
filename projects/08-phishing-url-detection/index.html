<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Phishing URL Detection</title><style>body{font-family:Arial;background:#120707;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,92%);padding:28px;background:#1d0d0d;border-radius:22px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#090909;color:#fff}button{background:#dc2626}</style><div class=box><h1>Phishing URL Detection</h1><input id=u placeholder="https://example.com"><button onclick=a>Scan URL</button><pre id=o></pre></div><script>function a(){let s=u.value.trim(),bad=/@|\.zip$|login.*verify|verify.*account|free.*gift|bit\.ly|tinyurl/i.test(s);o.textContent=bad?'⚠️ Potentially suspicious URL. Verify the domain before opening.':'✅ No simple demo red flags detected. This is not a full phishing classifier.'}</script>
