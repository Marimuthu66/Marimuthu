<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>AI Voice Assistant</title><style>body{font-family:Arial;background:#070812;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,92%);padding:28px;background:#101225;border-radius:22px;text-align:center}button{padding:15px 22px;border:0;border-radius:50%;background:#7c3aed;color:#fff;font-size:28px}#o{min-height:70px;padding:15px}</style><div class=box><h1>AI Voice Assistant</h1><button onclick=start()>🎙️</button><div id=o>Tap the microphone and speak.</div></div><script>function start(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){o.textContent='Speech recognition is not supported in this browser.';return}let R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R;r.lang='en-IN';r.onresult=e=>{let t=e.results[0][0].transcript;o.textContent='You said: '+t+'\n\nAI: I heard you. This is a browser demo; connect a backend model for full assistant actions.'};r.start()}</script>
