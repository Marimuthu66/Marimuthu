<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sentiment Analysis</title><style>body{font-family:Arial;background:#100b04;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,92%);padding:28px;background:#1c1307;border-radius:22px}textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#0d0a06;color:#fff}button{background:#f59e0b}</style><div class=box><h1>💬 Sentiment Analysis</h1><textarea id=t rows=6 placeholder="Type a review..."></textarea><button onclick=a()>Analyze</button><pre id=o></pre></div><script>function a(){let s=t.value.toLowerCase(),p=['good','great','love','excellent','happy','amazing'],n=['bad','hate','poor','worst','angry','terrible'],P=p.filter(x=>s.includes(x)).length,N=n.filter(x=>s.includes(x)).length;o.textContent=JSON.stringify({sentiment:P>N?'Positive':N>P?'Negative':'Neutral',positive_matches:P,negative_matches:N},null,2)}</script>
