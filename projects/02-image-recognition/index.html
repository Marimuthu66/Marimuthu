<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Recognition</title><style>body{font-family:Arial;background:#070b14;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(600px,90%);padding:28px;border:1px solid #ffffff22;border-radius:22px;background:#111827}.btn{padding:12px 18px;border:0;border-radius:10px;background:#7c3aed;color:#fff}pre{white-space:pre-wrap}</style><div class="box"><h1>🖼️ Image Recognition</h1><input id="f" type="file" accept="image/*"><button class="btn" onclick="go()">Recognize</button><pre id="o"></pre></div><script>function go(){const f=document.querySelector('#f').files[0];if(!f)return o.textContent='Upload an image first.';const im=new Image();im.onload=()=>o.textContent=JSON.stringify({label:'Image uploaded successfully',confidence:.95,size:im.width+' x '+im.height,note:'Educational demo. Connect a trained CNN/YOLO model for real object classification.'},null,2);im.src=URL.createObjectURL(f)}</script>
