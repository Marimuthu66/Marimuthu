<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cybersecurity Threat Detection</title><style>body{font-family:Arial;background:#050b0a;color:#eafff4;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,90%);padding:28px;border:1px solid #19f99a33;border-radius:22px;background:#071410}input,button{padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#111;color:#fff;margin:5px}button{background:#10b981}pre{white-space:pre-wrap}</style><div class=box><h1>🛡️ Cybersecurity Threat Detection</h1><input id=x placeholder="Enter URL / IP / event"><button onclick=scan()>Analyze</button><pre id=o></pre></div><script>function scan(){let v=x.value.trim();if(!v)return o.textContent='Enter a value.';let bad=/phish|malware|attack|hack|sql|<script/i.test(v);o.textContent=JSON.stringify({input:v,risk:bad?'High':'Low',status:bad?'Potential threat detected':'No obvious threat pattern in demo input',recommendation:bad?'Investigate and isolate the source.':'Continue monitoring.'},null,2)}</script>
