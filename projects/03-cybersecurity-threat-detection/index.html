<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Cybersecurity Threat Detection</title><style>body{font-family:Arial;background:#050505;color:#eee;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,92%);padding:28px;background:#111;border:1px solid #333;border-radius:22px}textarea,button{padding:12px;border-radius:10px;border:1px solid #444;background:#181818;color:#fff}textarea{width:100%;min-height:120px;box-sizing:border-box}button{background:#7c3aed;margin-top:10px;cursor:pointer}.out{margin-top:20px;padding:15px;background:#191919;border-radius:12px}</style><div class=box><h1>🛡️ Cybersecurity Threat Detection</h1><textarea id=i placeholder="Enter text to scan..."></textarea><button onclick=go()>Scan</button><div id=o class=out>Ready.</div></div><script>function go(){let t=i.value.toLowerCase(),bad=['malware','ransomware','keylogger','exploit','trojan','virus','payload','hack'],hits=bad.filter(x=>t.includes(x)),s=Math.min(100,hits.length*20),r=s<30?'Low':s<60?'Medium':'High';o.innerHTML='<b>Risk: '+r+'</b><br>Score: '+s+'<br>Indicators: '+(hits.join(', ')||'No obvious keyword indicators')}</script>
