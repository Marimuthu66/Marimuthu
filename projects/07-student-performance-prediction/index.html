<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Student Performance Prediction</title><style>body{font-family:Arial;background:#08120b;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(650px,92%);padding:28px;background:#102016;border-radius:22px}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ffffff22;background:#08100a;color:#fff}button{background:#16a34a}</style><div class=box><h1>Student Performance Prediction</h1><input id=a type=number placeholder="Study hours"><input id=b type=number placeholder="Attendance %"><input id=c type=number placeholder="Previous score"><button onclick="p()">Predict</button><pre id=o></pre></div><script>function p(){let x=Number(a.value),y=Number(b.value),z=Number(c.value);if(![x,y,z].every(Number.isFinite)){o.textContent='Enter all values.';return}o.textContent='Predicted score: '+Math.round(Math.min(100,x*3+y*.25+z*.45))+' / 100\nDemo regression model for portfolio preview.'}</script>
