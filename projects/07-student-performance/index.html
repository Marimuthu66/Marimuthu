<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Student Performance Prediction</title><style>body{font-family:Arial;background:#07100b;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(600px,92%);padding:28px;background:#102016;border-radius:22px}input,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#08100a;color:#fff;box-sizing:border-box}button{background:#16a34a}.out{margin-top:15px;padding:15px;background:#17251b;border-radius:10px}</style><div class=box><h1>🎓 Student Performance Prediction</h1><input id=a type=number placeholder="Attendance %"><input id=s type=number placeholder="Study hours"><input id=p type=number placeholder="Previous score"><button onclick=go()>Predict</button><div id=o class=out>Ready.</div></div><script>function go(){let A=+a.value,S=+s.value,P=+p.value,x=Math.min(100,Math.max(0,.30*A+.35*Math.min(S*10,100)+.35*P)),b=x>=80?'Excellent':x>=60?'Good':'Needs Improvement';o.innerHTML='<b>Predicted Score: '+x.toFixed(2)+'</b><br>Performance: '+b}</script>
