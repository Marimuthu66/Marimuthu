<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Fake News Detection</title><style>body{font-family:Arial;background:#0b0710;color:#fff;display:grid;place-items:center;min-height:100vh}.box{width:min(700px,92%);padding:28px;background:#17111e;border-radius:22px}textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#09090b;color:#fff}button{background:#db2777}</style><div class=box><h1>📰 Fake News Detection</h1><textarea id=t rows=7 placeholder="Paste a news headline or article..."></textarea><button onclick=check()>Check</button><pre id=o></pre></div><script>function check(){let s=t.value.toLowerCase();let flags=['shocking','100% true','secret cure','you won’t believe','breaking!!!'];let hit=flags.filter(x=>s.includes(x));o.textContent=hit.length?'⚠️ Suspicious wording detected. Review the source and evidence.':'ℹ️ Demo result: no listed clickbait patterns found. This is not a factual verification model.'}</script>
