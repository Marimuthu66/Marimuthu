<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C. Mari Muthu — AI Projects</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20134a,#05050a 55%);color:#fff;font-family:Inter,Arial;min-height:100vh;padding:40px 18px}main{max-width:1100px;margin:auto}h1{text-align:center;font-size:clamp(36px,7vw,70px);margin:10px}.sub{text-align:center;color:#aaa;margin-bottom:35px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#ffffff0b;border:1px solid #ffffff18;border-radius:22px;padding:24px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 45px #0006;transition:.3s}.card:hover{transform:translateY(-8px) rotateX(2deg);border-color:#8b5cf6}.icon{font-size:42px}.open{border:0;border-radius:12px;padding:12px;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);z-index:5;padding:20px}.panel{width:min(950px,100%);height:min(760px,92vh);margin:auto;background:#0b0b13;border:1px solid #ffffff22;border-radius:24px;overflow:hidden;box-shadow:0 30px 100px #000}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ffffff15}.close{background:#ffffff12;border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:18px}.frame{width:100%;height:calc(100% - 58px);border:0;background:#fff}@media(max-width:500px){body{padding:25px 12px}.card{min-height:190px}.panel{height:88vh}}</style><main><h1>🚀 My AI Projects</h1><p class=sub>Interactive project demos — click any card to run it.</p><div class=grid id=g></div></main><div class=modal id=m><div class=panel><div class=bar><b id=title></b><button class=close onclick=closeM()>✕</button></div><iframe id=f class=frame title="Project demo"></iframe></div></div><script>const projects=[['02','🖼️','Image Recognition','projects/02-image-recognition/'],['03','🛡️','Cybersecurity Threat Detection','projects/03-cybersecurity-threat-detection/'],['04','📰','Fake News Detection','projects/04-fake-news-detection/'],['05','📄','AI Resume Analyzer','projects/05-ai-resume-analyzer/'],['06','💬','Sentiment Analysis','projects/06-sentiment-analysis/'],['07','🎓','Student Performance Prediction','projects/07-student-performance-prediction/'],['08','🔐','Phishing URL Detection','projects/08-phishing-url-detection/'],['09','🎙️','AI Voice Assistant','projects/09-ai-voice-assistant/']];g.innerHTML=projects.map(p=>`<div class=card><div><div class=icon>${p[1]}</div><h2>${p[2]}</h2><p style="color:#999">Interactive browser demo</p></div><button class=open onclick="openM('${p[2]}','${p[3]}')">▶ Run Project</button></div>`).join('');function openM(t,u){title.textContent=t;f.src=u;m.style.display='block';document.body.style.overflow='hidden'}function closeM(){f.src='about:blank';m.style.display='none';document.body.style.overflow='auto'}m.onclick=e=>{if(e.target===m)closeM()}</script></html>
